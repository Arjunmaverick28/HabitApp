replicaCount: 2

image:
  repository: arjunmaverick/habit-tracker
  tag: "1.9"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

config:
  springApplicationName: habit-tracker
  serverPort: "8080"

secret:
  enabled: false
  data: {}
